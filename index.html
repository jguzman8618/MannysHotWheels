<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Manny's Hot Wheels</title>
<meta name="theme-color" content="#ff5b1f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#0b0d10;
    --panel:#15181d;
    --panel-2:#1c2027;
    --line:#272c34;
    --flame:#ff5b1f;
    --flame-dim:#c94517;
    --track-yellow:#f4c40f;
    --chrome:#f5f0e6;
    --muted:#9aa0a6;
    --go:#3ddc84;
    --stop:#e5484d;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--asphalt);
    color:var(--chrome);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:84px;
  }
  h1,h2,h3,.display{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    letter-spacing:0.02em;
    text-transform:uppercase;
    margin:0;
  }

  /* header */
  header{
    padding:22px 18px 16px;
    background:
      linear-gradient(180deg, rgba(255,91,31,0.14), transparent 70%),
      var(--asphalt);
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .checker{
    display:flex;
    width:64px;height:10px;
    margin-top:10px;
    border-radius:2px;
    overflow:hidden;
  }
  .checker span{flex:1;height:100%;}
  .checker span:nth-child(odd){background:var(--chrome);}
  .checker span:nth-child(even){background:var(--asphalt);border:1px solid var(--line);}
  header h1{font-size:28px;color:var(--chrome);}
  header h1 em{font-style:normal;color:var(--flame);}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px;}

  /* tabs */
  nav.tabs{
    display:flex;
    gap:0;
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    z-index:20;
  }
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-size:13px;
    padding:14px 4px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
  }
  nav.tabs button .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  nav.tabs button.active{color:var(--flame);}
  nav.tabs button.active .dot{background:var(--flame);}

  main{padding:16px;max-width:640px;margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }

  button.btn{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-size:14px;
    border:none;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
  }
  .btn-flame{background:var(--flame);color:#1a0c05;}
  .btn-flame:active{background:var(--flame-dim);}
  .btn-ghost{background:var(--panel-2);color:var(--chrome);border:1px solid var(--line);}
  .btn-stop{background:var(--stop);color:#2a0505;}
  .btn-sm{padding:8px 12px;font-size:12px;}
  .btn-block{width:100%;}

  label.field{display:block;margin-bottom:12px;}
  label.field span{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  input[type=text], select, textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--chrome);
    border-radius:8px;
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
  }
  textarea{resize:vertical;}
  input[type=text]:focus, select:focus, textarea:focus{outline:2px solid var(--flame);outline-offset:1px;}

  .newtote-row{display:flex;gap:8px;}
  .newtote-row input{flex:1;}

  .badge{
    display:inline-block;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--track-yellow);
    font-size:11px;
    font-weight:600;
    padding:3px 8px;
    border-radius:6px;
    font-family:'Rajdhani',sans-serif;
    letter-spacing:0.03em;
  }
  .th-badge{background:rgba(61,220,132,0.12);border-color:rgba(61,220,132,0.4);color:var(--go);}

  .toast{
    position:fixed;
    top:16px;left:50%;
    transform:translateX(-50%) translateY(-140%);
    background:var(--go);
    color:#04170c;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    border-radius:10px;
    z-index:50;
    transition:transform .25s ease;
    max-width:90%;
    text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--stop);color:#210404;}

  /* collection list */
  .toolbar{display:flex;gap:8px;margin-bottom:14px;}
  .toolbar input,.toolbar select{flex:1;}
  .item-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .row-thumb{width:40px;height:40px;object-fit:cover;border-radius:8px;background:#fff;flex-shrink:0;}
  .item-main .name{font-weight:600;font-size:15px;}
  .item-main .meta{color:var(--muted);font-size:12px;margin-top:2px;}
  .item-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:8px;
    width:32px;height:32px;
    font-size:14px;
    cursor:pointer;
  }
  .icon-btn.danger{color:var(--stop);}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;}

  /* totes grid */
  .tote-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tote-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    cursor:pointer;
  }
  .tote-card .count{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;color:var(--flame);}
  .tote-card .label{font-size:13px;color:var(--chrome);margin-top:2px;font-weight:600;}

  .section-title{font-size:12px;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase;margin:0 0 10px;font-weight:600;}

  .footer-actions{display:flex;gap:8px;margin-top:16px;}

  /* price check */
  .price-panel{
    margin-top:14px;
    border-top:1px dashed var(--line);
    padding-top:14px;
  }
  .price-panel.hidden{display:none;}
  .price-head{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
  .price-head img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;flex-shrink:0;}
  .price-head .ptitle{font-size:13px;font-weight:600;line-height:1.3;}

  .resale-block{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .resale-block .offer-row{
    background:linear-gradient(135deg, rgba(255,91,31,0.16), rgba(255,91,31,0.05));
    border:1px solid rgba(255,91,31,0.45);
    border-radius:10px;
    padding:13px 14px;
  }
  .resale-block .offer-row .merchant{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;
    text-transform:uppercase;letter-spacing:0.02em;
  }

  .other-offers-block{display:flex;flex-direction:column;margin-bottom:8px;}
  .offer-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line);
    font-size:13px;text-decoration:none;color:var(--chrome);
  }
  .offer-row:last-child{border-bottom:none;}
  .offer-row .merchant{font-weight:600;}
  .offer-row .cond{color:var(--muted);font-size:11px;margin-left:6px;}
  .offer-row .price{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:var(--track-yellow);}
  .offer-row .ship{font-family:'Inter',sans-serif;font-weight:400;font-size:10px;color:var(--muted);}
  .offer-row.unavailable{color:var(--muted);}
  .offer-row.unavailable .cond{margin-left:0;}
  .offer-row.link-only .cond{color:var(--flame);}

  .stats-row{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    margin:12px 0 4px;
  }
  .stats-row > div{
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:8px 6px;text-align:center;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:var(--chrome);
  }
  .stat-label{display:block;font-family:'Inter',sans-serif;font-weight:600;
    font-size:9px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:2px;}

  .price-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .price-note.identify-first{
    font-size:13px;color:var(--track-yellow);margin-top:0;
    background:rgba(244,196,15,0.08);border:1px solid rgba(244,196,15,0.35);
    border-radius:10px;padding:12px;line-height:1.5;
  }
  .price-note.identify-first strong{color:var(--chrome);}
  .spinner-text{color:var(--muted);font-size:13px;padding:6px 0;}
  .price-badge{
    display:inline-block;background:rgba(61,220,132,0.12);
    border:1px solid rgba(61,220,132,0.35);color:var(--go);
    font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;
    font-family:'Rajdhani',sans-serif;margin-left:4px;
  }
  .dupe-banner{
    background:rgba(244,196,15,0.1);
    border:1px solid rgba(244,196,15,0.4);
    border-radius:10px;
    padding:11px 12px;
    margin-bottom:12px;
    font-size:13px;
    color:var(--track-yellow);
  }
  .dupe-banner b{color:var(--chrome);}
  .dupe-banner.hidden{display:none;}

  /* photo capture */
  .photo-row{display:flex;gap:10px;margin:14px 0;}
  .photo-slot{
    flex:1;
    aspect-ratio:1/1;
    border-radius:10px;
    border:2px dashed var(--line);
    background:var(--panel-2);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    overflow:hidden;
    position:relative;
    color:var(--muted);
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:12px;
    letter-spacing:0.03em;
  }
  .photo-slot.filled{border-style:solid;border-color:var(--flame-dim);}
  .photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .photo-slot .plus{font-size:22px;line-height:1;}
  .photo-slot .retake{
    position:absolute;bottom:6px;right:6px;
    background:rgba(11,13,16,0.75);
    color:var(--chrome);
    font-size:10px;font-weight:700;
    padding:3px 7px;border-radius:6px;
    text-transform:uppercase;
  }
  .ocr-note{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .ocr-note.hidden{display:none;}
  .ocr-suggest{
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;margin-bottom:12px;
    font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .ocr-suggest.hidden{display:none;}
  .ocr-suggest button{
    background:var(--flame);color:#1a0c05;border:none;border-radius:6px;
    font-size:11px;font-weight:700;padding:6px 10px;cursor:pointer;
    text-transform:uppercase;font-family:'Rajdhani',sans-serif;flex-shrink:0;
  }
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .checkbox-row{
    display:flex;align-items:center;gap:8px;
    background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:11px 12px;font-size:14px;color:var(--chrome);
    cursor:pointer;
  }
  .checkbox-row input{width:16px;height:16px;accent-color:var(--flame);}
  .th-check{display:flex;flex-direction:column;}
</style>
</head>
<body>

<header>
  <h1>MANNY'S <em>HOT WHEELS</em></h1>
  <p>Snap it. Tote it. Track it.</p>
  <div class="checker"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
</header>

<main>

  <!-- SCAN VIEW -->
  <section id="view-scan" class="view active">
    <div class="card">
      <div class="section-title">Item details</div>
      <div class="dupe-banner hidden" id="dupeBanner"></div>
      <button class="btn btn-ghost btn-block" id="btnCheckPrice" type="button">Compare Prices</button>

      <div class="price-panel hidden" id="pricePanel"></div>

      <div class="photo-row">
        <label class="photo-slot" id="slotFront">
          <span class="plus">＋</span><span>Front photo</span>
          <input type="file" accept="image/*" capture="environment" id="fileFront" style="display:none;">
        </label>
        <label class="photo-slot" id="slotBack">
          <span class="plus">＋</span><span>Back photo</span>
          <input type="file" accept="image/*" capture="environment" id="fileBack" style="display:none;">
        </label>
      </div>
      <button class="btn btn-ghost btn-block" id="btnIdentify" type="button">Identify Car from Photos</button>
      <div class="ocr-note hidden" id="identifyNote">Looking at the photos…</div>
      <div class="ocr-suggest hidden" id="identifySuggest">
        <span id="identifySuggestText"></span>
        <button id="btnUseIdentify" type="button">Fill these in</button>
      </div>

      <div class="ocr-note hidden" id="ocrNote">Reading text from photo…</div>
      <div class="ocr-suggest hidden" id="ocrSuggest">
        <span id="ocrSuggestText"></span>
        <button id="btnUseOcr" type="button">Use this</button>
      </div>
      <div class="ocr-suggest hidden" id="ocrFieldSuggest">
        <span id="ocrFieldSuggestText"></span>
        <button id="btnUseOcrFields" type="button">Fill these in</button>
      </div>

      <label class="field" style="margin-top:16px;">
        <span>Vehicle name</span>
        <input type="text" id="fName" placeholder="e.g. Nissan Silvia S15" />
      </label>

      <div class="field-grid">
        <label class="field">
          <span>Series</span>
          <input type="text" id="fSeries" placeholder="e.g. Boulevard" />
        </label>
        <label class="field">
          <span>Release year</span>
          <input type="text" id="fYear" placeholder="e.g. 2024" inputmode="numeric" />
        </label>
      </div>
      <div class="field-grid">
        <label class="field">
          <span>Collector #</span>
          <input type="text" id="fCollectorNum" placeholder="e.g. 73 or 118/250" />
        </label>
        <label class="field">
          <span>Variant / color</span>
          <input type="text" id="fVariant" placeholder="e.g. Blue" />
        </label>
      </div>
      <div class="field-grid">
        <label class="field">
          <span>Premium / Mainline</span>
          <select id="fTier">
            <option value="">—</option>
            <option value="Mainline">Mainline</option>
            <option value="Premium">Premium</option>
          </select>
        </label>
        <label class="field th-check">
          <span>&nbsp;</span>
          <label class="checkbox-row"><input type="checkbox" id="fTreasureHunt"> Treasure Hunt</label>
        </label>
      </div>

      <label class="field">
        <span>Tote / Location</span>
        <select id="fTote"></select>
      </label>
      <div class="newtote-row" style="margin-bottom:12px;">
        <input type="text" id="fNewTote" placeholder="Or create a new tote..." />
        <button class="btn btn-ghost btn-sm" id="btnAddTote">Add</button>
      </div>
      <label class="field">
        <span>Label / notes</span>
        <textarea id="fLabel" rows="3" placeholder="Auto-generated once enough info is filled in"></textarea>
      </label>
      <button class="btn btn-flame btn-block" id="btnSaveItem">Save to Collection</button>
    </div>

    <div class="card">
      <div class="section-title">Recently added</div>
      <div id="recentList" class="empty">Nothing scanned yet.</div>
    </div>
  </section>

  <!-- COLLECTION VIEW -->
  <section id="view-collection" class="view">
    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="Search name, series, label..." />
      <select id="filterTote"><option value="">All totes</option></select>
    </div>
    <div class="card">
      <div id="collectionList" class="empty">No items yet — scan something!</div>
    </div>
    <div class="footer-actions">
      <button class="btn btn-ghost btn-block" id="btnExport">Export Backup</button>
      <button class="btn btn-ghost btn-block" id="btnImportTrigger">Import Backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
  </section>

  <!-- TOTES VIEW -->
  <section id="view-totes" class="view">
    <div class="card">
      <div class="section-title">Totes</div>
      <div id="toteGrid" class="tote-grid"></div>
    </div>
    <div class="card">
      <div class="section-title">Manage totes</div>
      <div id="toteManageList"></div>
    </div>
  </section>

</main>

<nav class="tabs">
  <button class="tab-btn active" data-view="scan"><span class="dot"></span>Scan</button>
  <button class="tab-btn" data-view="collection"><span class="dot"></span>Collection</button>
  <button class="tab-btn" data-view="totes"><span class="dot"></span>Totes</button>
</nav>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* ---------- config ---------- */
// Fill this in once you deploy the eBay backend Worker — see worker/README.md.
// Leave blank to run without live eBay pricing (the app degrades gracefully).
const EBAY_WORKER_URL = ""; // e.g. "https://mannys-hotwheels-ebay.you.workers.dev"

const PRICE_CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24 hours

/* ---------- storage: tiny IndexedDB wrapper ---------- */
const DB_NAME = "mannys_hw_db";
const DB_VER = 3;
let db;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains("items")){
        const s = d.createObjectStore("items",{keyPath:"id"});
        s.createIndex("tote","tote",{unique:false});
      }
      if(!d.objectStoreNames.contains("totes")){
        d.createObjectStore("totes",{keyPath:"name"});
      }
      // added in v2: pricing cache (24h TTL) and permanent ID cache
      if(!d.objectStoreNames.contains("priceCache")){
        d.createObjectStore("priceCache",{keyPath:"query"});
      }
      // v3: idCache is now keyed by identified car name, not barcode (the
      // barcode scanner was removed — different castings shared barcodes,
      // which made barcode a bad identity key). Rebuild the store cleanly.
      if(d.objectStoreNames.contains("idCache")){
        d.deleteObjectStore("idCache");
      }
      d.createObjectStore("idCache",{keyPath:"name"});
    };
    req.onsuccess = (e)=>{db=e.target.result; resolve(db);};
    req.onerror = (e)=>reject(e);
  });
}
function tx(store,mode){ return db.transaction(store,mode).objectStore(store); }
function getAll(store){
  return new Promise((resolve,reject)=>{
    const r = tx(store,"readonly").getAll();
    r.onsuccess=()=>resolve(r.result);
    r.onerror=(e)=>reject(e);
  });
}
function getOne(store,key){
  return new Promise((resolve,reject)=>{
    const r = tx(store,"readonly").get(key);
    r.onsuccess=()=>resolve(r.result || null);
    r.onerror=(e)=>reject(e);
  });
}
function put(store,val){
  return new Promise((resolve,reject)=>{
    const r = tx(store,"readwrite").put(val);
    r.onsuccess=()=>resolve();
    r.onerror=(e)=>reject(e);
  });
}
function del(store,key){
  return new Promise((resolve,reject)=>{
    const r = tx(store,"readwrite").delete(key);
    r.onsuccess=()=>resolve();
    r.onerror=(e)=>reject(e);
  });
}

/* ---------- state ---------- */
let items = [];
let totes = [];

/* ---------- toast ---------- */
function toast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isErr);
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------- tabs ---------- */
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("view-"+btn.dataset.view).classList.add("active");
    if(btn.dataset.view==="collection") renderCollection();
    if(btn.dataset.view==="totes") renderTotes();
  });
});

/* ---------- totes ---------- */
async function loadTotes(){
  totes = await getAll("totes");
  if(totes.length===0){
    totes = [{name:"Unsorted"}];
    await put("totes",{name:"Unsorted"});
  }
  refreshToteSelects();
}

/* ---------- canonical identification ---------- */

function readFormProfile(){
  return {
    name: document.getElementById("fName").value.trim(),
    series: document.getElementById("fSeries").value.trim(),
    year: document.getElementById("fYear").value.trim(),
    collectorNum: document.getElementById("fCollectorNum").value.trim(),
    variant: document.getElementById("fVariant").value.trim(),
    tier: document.getElementById("fTier").value,
    treasureHunt: document.getElementById("fTreasureHunt").checked,
    ocrText: ocrCombinedText
  };
}

// One canonical search string used for every marketplace query — built from
// whatever structured info we actually have, preferring specific fields
// (name/series/year/variant) over the bare barcode, since the barcode alone
// often only identifies a whole assortment, not the exact casting.
function canonicalQueryString(profile){
  const parts = ["Hot Wheels"];
  if(profile.year) parts.push(profile.year);
  if(profile.name) parts.push(profile.name);
  if(profile.series) parts.push(profile.series);
  if(profile.variant) parts.push(profile.variant);
  if(profile.tier==="Premium") parts.push("Premium");
  if(profile.treasureHunt) parts.push("Treasure Hunt");
  const built = parts.join(" ").trim();
  if(built !== "Hot Wheels") return built;
  // nothing structured yet — fall back to whatever OCR caught
  const ocrGuess = (profile.ocrText||"").split("\n").map(l=>l.trim())
    .filter(l=>l.length>=3 && l.length<=40 && /[a-zA-Z]/.test(l))
    .sort((a,b)=>b.length-a.length)[0];
  return ocrGuess ? ("Hot Wheels " + ocrGuess) : "Hot Wheels";
}

function buildAutoLabel(profile){
  if(!profile.name && !profile.year) return null; // not enough to build a meaningful label
  const line1 = (profile.year ? profile.year + " " : "") + "Hot Wheels";
  const line2 = profile.name || null;
  const seriesBits = [];
  if(profile.series) seriesBits.push(profile.series);
  if(profile.collectorNum) seriesBits.push("#"+profile.collectorNum);
  const line3 = seriesBits.length ? seriesBits.join(" ") : null;
  const line4 = profile.treasureHunt ? "Treasure Hunt" : (profile.tier || null);
  return [line1, line2, line3, line4].filter(Boolean).join("\n");
}

// Auto-fills the Label field once there's enough identification to build a
// meaningful one — but never overwrites text the user already typed there.
function maybeAutoLabel(){
  const labelField = document.getElementById("fLabel");
  if(labelField.dataset.userEdited === "true") return;
  const profile = readFormProfile();
  const auto = buildAutoLabel(profile);
  if(auto) labelField.value = auto;
}
document.getElementById("fLabel").addEventListener("input", (e)=>{
  e.target.dataset.userEdited = "true"; // once they type, stop auto-overwriting
});
["fName","fSeries","fYear","fCollectorNum","fVariant","fTier","fTreasureHunt"].forEach(id=>{
  document.getElementById(id).addEventListener("change", maybeAutoLabel);
});

/* ---------- pricing engine (provider-based, 5 fixed slots) ---------- */
let draftPrice = null;

function fetchWithTimeout(url, ms, opts){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  return fetch(url, {...(opts||{}), signal: controller.signal})
    .then(res => { clearTimeout(timer); if(!res.ok) throw new Error("bad status " + res.status); return res.json(); })
    .catch(err => { clearTimeout(timer); throw err; });
}

async function fetchJsonWithFallback(targetUrl){
  const urls = [
    targetUrl,
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl),
    "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(targetUrl),
    "https://corsproxy.io/?url=" + encodeURIComponent(targetUrl)
  ];
  try{
    return await Promise.any(urls.map(u => fetchWithTimeout(u, 6000)));
  }catch(err){
    return null;
  }
}

// ---- provider: eBay (real API, via the Cloudflare Worker backend) ----
async function ebayProvider(query){
  if(!EBAY_WORKER_URL) return { available:false, reason:"not_configured", results:[] };
  try{
    const url = EBAY_WORKER_URL.replace(/\/$/,"") + "/ebay-search?q=" + encodeURIComponent(query);
    const data = await fetchWithTimeout(url, 8000);
    if(data && data.error) return { available:false, reason:data.error, results:[] };
    return { available:true, results:(data && data.results) || [] };
  }catch(err){
    return { available:false, reason:"unreachable", results:[] };
  }
}

// ---- provider: Google Shopping via SerpApi, through the same Worker.
// This is what actually makes a real Amazon price possible — eBay and
// Amazon both submit their catalogs to Google Shopping themselves, so this
// surfaces real listings from both (plus Walmart/Target/etc.) in one call. ----
async function shopProvider(query){
  if(!EBAY_WORKER_URL) return { available:false, reason:"not_configured", results:[] };
  try{
    const url = EBAY_WORKER_URL.replace(/\/$/,"") + "/shop-search?q=" + encodeURIComponent(query);
    const data = await fetchWithTimeout(url, 8000);
    if(data && data.error) return { available:false, reason:data.error, results:[] };
    return { available:true, results:(data && data.results) || [] };
  }catch(err){
    return { available:false, reason:"unreachable", results:[] };
  }
}

// Amazon fallback: link-only, used only when no real Amazon price was
// found via Google Shopping. Never scraped, never faked as a price.
function amazonLinkSlot(query){
  return {
    marketplace: "Amazon",
    linkOnly: true,
    url: `https://www.amazon.com/s?k=${encodeURIComponent(query)}`
  };
}

async function getCachedPricing(query){
  try{
    const cached = await getOne("priceCache", query);
    if(cached && (Date.now() - cached.cachedAt) < PRICE_CACHE_TTL_MS) return cached.payload;
  }catch(err){ /* cache miss is fine */ }
  return null;
}
async function setCachedPricing(query, payload){
  try{ await put("priceCache", { query, payload, cachedAt: Date.now() }); }catch(err){ /* non-fatal */ }
}

function median(nums){
  if(!nums.length) return null;
  const s = [...nums].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
}

// True if the profile has enough real signal to search marketplaces with.
function hasRealIdentification(profile){
  if(profile.name || profile.series || profile.variant) return true;
  if(profile.ocrText && profile.ocrText.trim().split("\n").some(l=>l.trim().length>=3 && /[a-zA-Z]/.test(l))) return true;
  return false;
}

async function runPricingEngine(profile){
  let query = canonicalQueryString(profile);
  let identifyInfo = null; // surfaced to the UI when AI photo ID was used to resolve the query

  // Nothing real to search with yet (no name/series/OCR) — identify from
  // photos automatically before ever giving up. Never search with nothing.
  if(!hasRealIdentification(profile)){
    const idData = await runIdentify(true); // silent — automatic attempt, not user-triggered
    if(idData){
      if(idData.isCustom && idData.searchDescription){
        query = "custom Hot Wheels " + idData.searchDescription;
        identifyInfo = { isCustom:true, description: idData.searchDescription, confidence: idData.confidence };
      } else if(idData.name){
        query = ["Hot Wheels", idData.year, idData.name, idData.series, idData.variant].filter(Boolean).join(" ");
        identifyInfo = { isCustom:false, name: idData.name, confidence: idData.confidence };
      }
      if(idData.name || idData.isCustom) showIdentifySuggestion(idData); // let the user see + confirm the fields too
    }
    if(!identifyInfo){
      // truly nothing to go on — no manual info AND no usable photo yet.
      // Not a dead end: tell the user the one concrete thing that unblocks it.
      return {
        slots: null,
        needsPhoto: true,
        stats: null,
        productTitle: null,
        productImage: null,
        fromCache: false,
        query
      };
    }
  }

  const cached = await getCachedPricing(query);
  if(cached) return { ...cached, fromCache:true, query, identifyInfo };

  // run both real data sources in parallel — one slow/unavailable source
  // never blocks the other (graceful degradation)
  const [ebayRes, shopRes] = await Promise.allSettled([
    ebayProvider(query),
    shopProvider(query)
  ]);

  const ebay = ebayRes.status === "fulfilled" ? ebayRes.value : { available:false, results:[] };
  const shop = shopRes.status === "fulfilled" ? shopRes.value : { available:false, results:[] };

  // slot 1: eBay — prefer the dedicated Browse API (most precise), fall
  // back to an eBay listing surfaced via Google Shopping if that's all we have
  const shopEbay = shop.results.find(r => /ebay/i.test(r.marketplace));
  const slot1 = (ebay.available && ebay.results.length)
    ? ebay.results[0]
    : (shopEbay || { marketplace:"eBay", unavailable:true, message:"No verified eBay listing found" });

  // slot 2: Amazon — a REAL price if Google Shopping surfaced one, since
  // Amazon submits its own catalog there; otherwise a plain search link
  const shopAmazon = shop.results.find(r => /amazon/i.test(r.marketplace));
  const slot2 = shopAmazon || amazonLinkSlot(query);

  // slots 3-5: three lowest verified prices from everything else Google
  // Shopping surfaced (Walmart/Target/other sellers), minus what filled 1/2
  const usedShopUrls = new Set([shopEbay && shopEbay.url, shopAmazon && shopAmazon.url].filter(Boolean));
  const remainingShop = shop.results.filter(r => !usedShopUrls.has(r.url) && !/ebay|amazon/i.test(r.marketplace));
  const seen = new Set();
  const deduped = remainingShop.filter(r=>{
    const key = r.marketplace + "|" + r.totalCost;
    if(seen.has(key)) return false;
    seen.add(key); return true;
  }).sort((a,b)=>a.totalCost - b.totalCost);

  const slots345 = deduped.slice(0,3);
  while(slots345.length < 3){
    slots345.push({ marketplace:"—", unavailable:true, message:"No additional verified listings found" });
  }

  const numericPrices = [
    ...(slot1.totalCost!=null ? [slot1.totalCost] : []),
    ...(slot2.totalCost!=null ? [slot2.totalCost] : []),
    ...slots345.filter(s=>s.totalCost!=null).map(s=>s.totalCost)
  ];
  const stats = numericPrices.length ? {
    lowest: Math.min(...numericPrices),
    highest: Math.max(...numericPrices),
    average: Number((numericPrices.reduce((a,b)=>a+b,0)/numericPrices.length).toFixed(2)),
    median: median(numericPrices)
  } : null;

  const anyShopResult = shopEbay || shopAmazon || remainingShop[0] || null;

  const payload = {
    slots: [slot1, slot2, ...slots345],
    stats,
    productTitle: (anyShopResult && anyShopResult.title) || profile.name || null,
    productImage: (anyShopResult && anyShopResult.image) || null,
    identifyInfo
  };

  await setCachedPricing(query, payload);
  return { ...payload, fromCache:false, query };
}

function offerRowHtml(o){
  if(o.unavailable){
    return `<div class="offer-row unavailable"><span class="merchant">${escapeHtml(o.marketplace)}</span><span class="cond">${escapeHtml(o.message)}</span></div>`;
  }
  if(o.linkOnly){
    return `<a class="offer-row link-only" href="${o.url}" target="_blank" rel="noopener">
      <span class="merchant">${escapeHtml(o.marketplace)}</span>
      <span class="cond">search link ↗</span>
    </a>`;
  }
  return `<a class="offer-row" href="${o.url||'#'}" target="_blank" rel="noopener">
    <span><span class="merchant">${escapeHtml(o.marketplace)}</span>${o.condition?(`<span class="cond">${escapeHtml(o.condition)}</span>`):""}</span>
    <span class="price">$${o.totalCost.toFixed(2)}${o.shipping?` <span class="ship">(+$${o.shipping.toFixed(2)} ship)</span>`:""}</span>
  </a>`;
}

// Permanent ID cache: once a casting's identification fields have been
// confirmed (saved) once, prefill them automatically next time that same
// name is entered or identified again.
async function maybeApplyIdCache(){
  const name = document.getElementById("fName").value.trim();
  if(!name) return;
  try{
    const cached = await getOne("idCache", name.toLowerCase());
    if(!cached) return;
    const setIfEmpty = (id,val)=>{ const el=document.getElementById(id); if(val && !el.value) el.value = val; };
    setIfEmpty("fSeries", cached.series);
    setIfEmpty("fYear", cached.year);
    setIfEmpty("fCollectorNum", cached.collectorNum);
    setIfEmpty("fVariant", cached.variant);
    if(cached.tier && !document.getElementById("fTier").value) document.getElementById("fTier").value = cached.tier;
    if(cached.treasureHunt) document.getElementById("fTreasureHunt").checked = true;
    maybeAutoLabel();
    toast("Filled in from a previous entry of this car");
  }catch(err){ /* no cache entry — fine */ }
}

async function checkPrices(){
  const profile = readFormProfile();
  const panel = document.getElementById("pricePanel");

  panel.classList.remove("hidden");
  panel.innerHTML = `<div class="spinner-text">Identifying the car and checking sources…</div>`;

  const result = await runPricingEngine(profile);

  if(result.needsPhoto){
    panel.innerHTML = `
      <div class="price-note identify-first">
        Nothing to identify this car with yet.
        <strong>Take a front or back photo</strong> above, then tap
        Compare Prices again — it'll identify it automatically and search from there.
      </div>`;
    draftPrice = null;
    return;
  }

  // auto-fill the name field if empty and the retailer lookup found a title
  const nameField = document.getElementById("fName");
  if(!nameField.value.trim() && result.productTitle){
    nameField.value = result.productTitle;
    maybeAutoLabel();
  }

  const identifyNoteHtml = result.identifyInfo ? (
    result.identifyInfo.isCustom
      ? `<div class="price-note identify-first">Identified as a <strong>custom/unofficial car</strong> from your photos — prices below are estimates based on visually similar customs, not an exact catalog match.</div>`
      : `<div class="price-note identify-first">Identified from your photos${result.identifyInfo.confidence==="low" ? " (low confidence — double check)" : ""}: <strong>${escapeHtml(result.identifyInfo.name)}</strong></div>`
  ) : "";

  const [slot1, slot2, ...rest] = result.slots;
  const nameForKey = document.getElementById("fName").value.trim()
    || (result.identifyInfo && result.identifyInfo.name)
    || result.productTitle || "";
  const nameKey = nameForKey.trim().toLowerCase();
  draftPrice = (slot1 && slot1.totalCost!=null)
    ? { nameKey, lowest: slot1.totalCost, lowestMerchant: "eBay", checkedAt: Date.now() }
    : (rest.find(s=>s.totalCost!=null)
        ? { nameKey, lowest: rest.find(s=>s.totalCost!=null).totalCost, lowestMerchant: rest.find(s=>s.totalCost!=null).marketplace, checkedAt: Date.now() }
        : null);

  const imgHtml = result.productImage ? `<img src="${result.productImage}" alt="" />` : "";
  const statsHtml = result.stats ? `
    <div class="stats-row">
      <div><span class="stat-label">Low</span>$${result.stats.lowest.toFixed(2)}</div>
      <div><span class="stat-label">High</span>$${result.stats.highest.toFixed(2)}</div>
      <div><span class="stat-label">Avg</span>$${result.stats.average.toFixed(2)}</div>
      <div><span class="stat-label">Median</span>$${result.stats.median.toFixed(2)}</div>
    </div>` : "";

  panel.innerHTML = `
    ${identifyNoteHtml}
    ${result.productTitle ? `<div class="price-head">${imgHtml}<div class="ptitle">${escapeHtml(result.productTitle)}</div></div>` : ""}
    <div class="resale-block">
      ${offerRowHtml(slot1)}
      ${offerRowHtml(slot2)}
    </div>
    <div class="other-offers-block">
      ${rest.map(offerRowHtml).join("")}
    </div>
    ${statsHtml}
    ${result.fromCache ? `<div class="price-note">Cached result (rechecks within 24h reuse this).</div>` : ""}
    ${!EBAY_WORKER_URL ? `<div class="price-note">eBay backend isn't configured yet — see worker/README.md to enable live eBay prices.</div>` : ""}
  `;
}

/* ---------- photo capture + OCR name suggestion ---------- */
let draftPhotos = { front: null, back: null };

function resizeImage(file, maxW){
  return new Promise((resolve)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e)=>{ img.src = e.target.result; };
    img.onload = ()=>{
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.72));
    };
    reader.readAsDataURL(file);
  });
}

function setPhotoSlot(slotId, dataUrl){
  const slot = document.getElementById(slotId);
  slot.classList.add("filled");
  slot.innerHTML = `<img src="${dataUrl}" alt="" /><span class="retake">Retake</span>`;
  // re-attach the hidden file input (innerHTML replace wiped it)
  const inputId = slotId === "slotFront" ? "fileFront" : "fileBack";
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*"; input.capture = "environment";
  input.id = inputId; input.style.display = "none";
  slot.appendChild(input);
  bindPhotoInput(inputId, slotId, true);
}

function resetPhotoSlots(){
  draftPhotos = { front: null, back: null };
  ["slotFront","slotBack"].forEach((slotId, i)=>{
    const slot = document.getElementById(slotId);
    slot.classList.remove("filled");
    const label = i===0 ? "Front photo" : "Back photo";
    slot.innerHTML = `<span class="plus">＋</span><span>${label}</span>`;
    const inputId = i===0 ? "fileFront" : "fileBack";
    const input = document.createElement("input");
    input.type = "file"; input.accept = "image/*"; input.capture = "environment";
    input.id = inputId; input.style.display = "none";
    slot.appendChild(input);
    bindPhotoInput(inputId, slotId, true);
  });
  document.getElementById("ocrSuggest").classList.add("hidden");
  document.getElementById("ocrFieldSuggest").classList.add("hidden");
  document.getElementById("ocrNote").classList.add("hidden");
  document.getElementById("identifySuggest").classList.add("hidden");
  document.getElementById("identifyNote").classList.add("hidden");
  ocrCombinedText = "";
  ocrCandidates = [];
  window.__ocrFieldGuesses = null;
  window.__identifyResult = null;
}

function bindPhotoInput(inputId, slotId, runOcr){
  const input = document.getElementById(inputId);
  input.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const dataUrl = await resizeImage(file, 700);
    draftPhotos[slotId === "slotFront" ? "front" : "back"] = dataUrl;
    setPhotoSlot(slotId, dataUrl);
    if(runOcr) runOcrOnBack(dataUrl, slotId === "slotFront" ? "front" : "back");
  });
  document.getElementById(slotId).addEventListener("click", (e)=>{
    if(e.target.closest("input")) return; // avoid double-trigger
    document.getElementById(inputId).click();
  });
}

let ocrCombinedText = ""; // accumulated across front+back, used in the canonical profile
let ocrCandidates = [];   // {text, side} pairs collected across both photos

// Packaging boilerplate that should never be suggested as the vehicle name —
// this is what was causing legal/regulatory sentences to get picked.
const OCR_BLACKLIST = [
  /anniversary/i, /subject to availability/i, /colors? and decorations?/i,
  /trademark/i, /mattel/i, /manufactured/i, /warning/i, /small parts?/i,
  /not intended/i, /ages? \d/i, /consumer information/i, /conforms? to/i,
  /astm/i, /proof of purchase/i, /www\.|http|\.com/i, /choking hazard/i,
  /distributed by/i, /assembled in/i, /made in/i, /batteries/i,
  /recycl/i, /copyright|©|®|™/i, /\btel\b|\bfax\b|1-8\d{2}-/i,
  /collect them all/i, /each sold separately/i
];

function scoreOcrLine(line, side){
  const wordCount = line.split(/\s+/).filter(Boolean).length;
  const digitRatio = (line.match(/\d/g) || []).length / line.length;
  let score = 0;

  if(OCR_BLACKLIST.some(re => re.test(line))) return -100; // hard reject

  if(line.length >= 5 && line.length <= 30) score += 10;
  else if(line.length > 30) score -= (line.length - 30) * 0.5;

  if(wordCount <= 5) score += 8;
  else score -= (wordCount - 5) * 4; // sentences get penalized hard

  if(digitRatio > 0.3) score -= 20; // likely barcode/address noise

  if(/^[A-Z0-9 '&\-]+$/.test(line)) score += 12;        // ALL CAPS — common for card titles
  else if(/^([A-Z][a-z']*\s*)+$/.test(line)) score += 8; // Title Case

  if(side === "front") score += 15; // the actual name is far more often on the front

  return score;
}

async function runOcrOnBack(dataUrl, side){
  const note = document.getElementById("ocrNote");
  const nameSuggest = document.getElementById("ocrSuggest");
  const fieldSuggest = document.getElementById("ocrFieldSuggest");
  nameSuggest.classList.add("hidden");
  fieldSuggest.classList.add("hidden");
  if(typeof Tesseract === "undefined"){
    return; // library failed to load — skip silently, manual entry still works
  }
  note.classList.remove("hidden");
  try{
    const result = await Tesseract.recognize(dataUrl, "eng");
    const raw = (result && result.data && result.data.text) || "";
    ocrCombinedText = (ocrCombinedText + "\n" + raw).trim();

    // add this photo's qualifying lines to the running candidate pool,
    // then re-score everything collected so far (from both photos) together
    raw.split("\n")
      .map(l=>l.trim())
      .filter(l=>l.length>=3 && l.length<=60 && /[a-zA-Z]/.test(l))
      .forEach(l => ocrCandidates.push({ text:l, side }));

    const scored = ocrCandidates
      .map(c => ({ ...c, score: scoreOcrLine(c.text, c.side) }))
      .sort((a,b)=>b.score - a.score);
    const best = scored[0];

    // only suggest if it actually looks plausible — silence beats a bad guess
    if(best && best.score > 5){
      document.getElementById("ocrSuggestText").textContent = `Read from photo: "${best.text}"`;
      nameSuggest.classList.remove("hidden");
    }

    // structured field guesses from the combined text so far
    const guesses = extractFieldsFromText(ocrCombinedText);
    const parts = [];
    if(guesses.year) parts.push(`Year: ${guesses.year}`);
    if(guesses.collectorNum) parts.push(`Collector #: ${guesses.collectorNum}`);
    if(guesses.tier) parts.push(guesses.tier);
    if(guesses.treasureHunt) parts.push("Treasure Hunt");
    if(parts.length){
      window.__ocrFieldGuesses = guesses;
      document.getElementById("ocrFieldSuggestText").textContent = "Found: " + parts.join(" · ");
      fieldSuggest.classList.remove("hidden");
    }
  }catch(err){
    /* OCR failed — no big deal, manual entry still works */
  }finally{
    note.classList.add("hidden");
  }
}

// Pure regex heuristics — no AI/vision call, so this is best-effort and
// always shown as a suggestion the user confirms, never auto-committed silently.
function extractFieldsFromText(text){
  const out = {};
  const yearMatch = text.match(/\b(19[9]\d|20[0-4]\d)\b/); // 1990-2049
  if(yearMatch) out.year = yearMatch[1];

  const collectorMatch = text.match(/\b(\d{1,3}\s?\/\s?\d{2,4})\b/) // "118/250"
    || text.match(/#\s?(\d{1,4})\b/);                                // "#73"
  if(collectorMatch) out.collectorNum = collectorMatch[1].replace(/\s/g,"");

  if(/\btreasure\s*hunt\b/i.test(text) || /\bT\.?H\.?\b/.test(text)) out.treasureHunt = true;
  if(/\bpremium\b/i.test(text)) out.tier = "Premium";
  else if(/\bmainline\b/i.test(text)) out.tier = "Mainline";

  return out;
}

document.getElementById("btnUseOcr").addEventListener("click", ()=>{
  const text = document.getElementById("ocrSuggestText").textContent.replace(/^Read from photo: "|"$/g, "");
  document.getElementById("fName").value = text;
  document.getElementById("ocrSuggest").classList.add("hidden");
  maybeAutoLabel();
});

document.getElementById("btnUseOcrFields").addEventListener("click", ()=>{
  const g = window.__ocrFieldGuesses || {};
  if(g.year) document.getElementById("fYear").value = g.year;
  if(g.collectorNum) document.getElementById("fCollectorNum").value = g.collectorNum;
  if(g.tier) document.getElementById("fTier").value = g.tier;
  if(g.treasureHunt) document.getElementById("fTreasureHunt").checked = true;
  document.getElementById("ocrFieldSuggest").classList.add("hidden");
  maybeAutoLabel();
});

bindPhotoInput("fileFront", "slotFront", true);
bindPhotoInput("fileBack", "slotBack", true);

/* ---------- photo-based identification (Gemini vision, via the Worker) ---------- */
window.__identifyResult = null;

// Reusable: calls the /identify endpoint and returns the parsed result
// (or null on failure/not-configured), independent of any UI updates.
async function runIdentify(silent){
  if(!EBAY_WORKER_URL) return null;
  if(!draftPhotos.front && !draftPhotos.back) return null;
  try{
    const stripPrefix = (dataUrl) => dataUrl ? dataUrl.replace(/^data:image\/\w+;base64,/, "") : null;
    const url = EBAY_WORKER_URL.replace(/\/$/,"") + "/identify";
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        front: stripPrefix(draftPhotos.front),
        back: stripPrefix(draftPhotos.back)
      })
    });
    const data = await res.json();
    if(!res.ok || data.error){
      if(!silent) toast("Identify failed: " + (data.error || res.status), true);
      return null;
    }
    return data;
  }catch(err){
    if(!silent) toast("Identify failed — check your connection", true);
    return null;
  }
}

function showIdentifySuggestion(data){
  window.__identifyResult = data;
  const suggest = document.getElementById("identifySuggest");
  const bits = [];
  if(data.isCustom){
    bits.push("Custom — " + (data.searchDescription || "unrecognized casting"));
  }else{
    if(data.name) bits.push(data.name);
    if(data.series) bits.push(data.series);
    if(data.collectorNumber) bits.push("#"+data.collectorNumber);
    if(data.treasureHunt) bits.push("Treasure Hunt");
  }
  const label = bits.length ? bits.join(" · ") : "Nothing confidently identified";
  const confNote = data.confidence === "low" ? " (low confidence — double check)" : "";
  document.getElementById("identifySuggestText").textContent = label + confNote;
  if(bits.length){ suggest.classList.remove("hidden"); return true; }
  return false;
}

document.getElementById("btnIdentify").addEventListener("click", async ()=>{
  const note = document.getElementById("identifyNote");
  document.getElementById("identifySuggest").classList.add("hidden");

  if(!EBAY_WORKER_URL){ toast("Set EBAY_WORKER_URL first — see worker/README.md", true); return; }
  if(!draftPhotos.front && !draftPhotos.back){ toast("Take a front or back photo first", true); return; }

  note.classList.remove("hidden");
  const data = await runIdentify(false);
  note.classList.add("hidden");
  if(!data) return;
  if(!showIdentifySuggestion(data)){
    toast("Couldn't confidently identify this car — try clearer photos or enter manually", true);
  }
});

document.getElementById("btnUseIdentify").addEventListener("click", ()=>{
  const d = window.__identifyResult;
  if(!d) return;
  const setIfEmpty = (id,val)=>{ const el=document.getElementById(id); if(val && !el.value) el.value = val; };
  setIfEmpty("fName", d.isCustom ? ("Custom — " + (d.searchDescription||"")) : d.name);
  setIfEmpty("fSeries", d.series);
  setIfEmpty("fYear", d.year);
  setIfEmpty("fCollectorNum", d.collectorNumber);
  setIfEmpty("fVariant", d.variant);
  if(d.tier && !document.getElementById("fTier").value) document.getElementById("fTier").value = d.tier;
  if(d.treasureHunt) document.getElementById("fTreasureHunt").checked = true;
  document.getElementById("identifySuggest").classList.add("hidden");
  maybeAutoLabel();
  checkDuplicate();
  toast("Filled in from photo identification");
});

(async function init(){
  await openDB();
  await loadTotes();
  await loadItems();
  renderRecent();
  renderCollection();
  renderTotes();

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  }
})();
</script>
